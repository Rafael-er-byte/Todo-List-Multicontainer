services:
    mongodb:
        image: mongo:latest
        container_name: mongodb
        ports:
          - "27017:27017"

        environment:
            MONGO_INITDB_ROOT_USERNAME: root
            MONGO_INITDB_ROOT_PASSWORD: example

    volumes:
        mongodb_data:

    backend:
        build: ./backend
        container_name: backend
        ports:
            - "3000:3000"
        depends_on:
            - mongodb
        environment:
            MONGO_URI: mongodb://root:example@mongodb:27017/todo?authSource=admin
